<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-lines-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Contacts Manager</h1>
                    <p class="text-secondary-contrast small">Keep every contact in one place</p>
                </div>

                <!-- Auth Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">

                        <!-- Tabs -->
                        <ul class="nav nav-pills auth-tabs justify-content-center mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="tab-signin" data-bs-toggle="pill" data-bs-target="#pane-signin" type="button" role="tab" aria-controls="pane-signin" aria-selected="true">Sign In</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#pane-register" type="button" role="tab" aria-controls="pane-register" aria-selected="false">Register</button>
                            </li>
                        </ul>

                        <div class="tab-content">

                            <!-- Sign In -->
                            <div class="tab-pane fade show active" id="pane-signin" role="tabpanel" aria-labelledby="tab-signin">
                                <form id="signInForm" novalidate>
                                    <div class="mb-3">
                                        <label for="signInLogin" class="form-label form-label-contrast small">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                            <input type="text" id="signInLogin" class="form-control" placeholder="Enter your username" autocomplete="username" required />
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="signInPassword" class="form-label form-label-contrast small">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                            <input type="password" id="signInPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password" required />
                                        </div>
                                    </div>
                                    <button type="submit" id="signInButton" class="btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                        <span>Sign In</span>
                                        <i class="bi bi-arrow-right"></i>
                                    </button>
                                    <div class="mt-3 text-center">
                                        <span id="signInResult" class="small fw-semibold"></span>
                                    </div>
                                </form>
                            </div>

                            <!-- Register -->
                            <div class="tab-pane fade" id="pane-register" role="tabpanel" aria-labelledby="tab-register">
                                <form id="registerForm" novalidate>
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <label for="regFirstName" class="form-label form-label-contrast small">First Name</label>
                                            <input type="text" id="regFirstName" class="form-control" placeholder="Jane" required />
                                        </div>
                                        <div class="col-6">
                                            <label for="regLastName" class="form-label form-label-contrast small">Last Name</label>
                                            <input type="text" id="regLastName" class="form-control" placeholder="Doe" required />
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="regLogin" class="form-label form-label-contrast small">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                            <input type="text" id="regLogin" class="form-control" placeholder="Choose a username" autocomplete="username" required />
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="regPassword" class="form-label form-label-contrast small">Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                            <input type="password" id="regPassword" class="form-control" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
                                        </div>
                                    </div>
                                    <div class="mb-4">
                                        <label for="regPasswordConfirm" class="form-label form-label-contrast small">Confirm Password</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock-fill text-secondary-contrast"></i></span>
                                            <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Re-enter password" autocomplete="new-password" minlength="8" required />
                                        </div>
                                    </div>
                                    <button type="submit" id="registerButton" class="btn btn-success w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                        <span>Create Account</span>
                                        <i class="bi bi-person-plus"></i>
                                    </button>
                                    <div class="mt-3 text-center">
                                        <span id="registerResult" class="small fw-semibold"></span>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/client.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
