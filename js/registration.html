<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Contacts Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">Create Account</h1>
                    <p class="text-secondary-contrast small">Join the Contacts Manager</p>
                </div>

                <!-- Registration Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">
                        <form id="registrationForm" novalidate>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="regFirstName" class="form-label form-label-contrast small">First Name</label>
                                    <input type="text" id="regFirstName" class="form-control" placeholder="Jane" required />
                                </div>
                                <div class="col-6">
                                    <label for="regLastName" class="form-label form-label-contrast small">Last Name</label>
                                    <input type="text" id="regLastName" class="form-control" placeholder="Doe" required />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regLogin" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="regLogin" class="form-control" placeholder="Choose a username" autocomplete="username" minlength="3" required />
                                </div>
                            </div>

                            <div class="mb-2">
                                <label for="regPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="regPassword" class="form-control" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
                                </div>
                            </div>

                            <div class="section-card p-3 rounded-3 border mb-3">
                                <p class="text-info-wcag small fw-semibold mb-1"><i class="bi bi-shield-check me-1"></i> Strong passwords use:</p>
                                <ul class="text-secondary-contrast small mb-0 ps-3">
                                    <li>At least 8 characters</li>
                                    <li>A mix of uppercase &amp; lowercase letters</li>
                                    <li>At least one number</li>
                                </ul>
                            </div>

                            <div class="mb-4">
                                <label for="regPasswordConfirm" class="form-label form-label-contrast small">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill text-secondary-contrast"></i></span>
                                    <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Re-enter password" autocomplete="new-password" minlength="8" required />
                                </div>
                            </div>

                            <button type="submit" id="registerButton" class="btn btn-success w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Create Account</span>
                                <i class="bi bi-person-plus"></i>
                            </button>
                            <div class="mt-3 text-center">
                                <span id="registerResult" class="small fw-semibold"></span>
                            </div>
                        </form>

                        <div class="mt-4 pt-3 text-center small text-secondary-contrast border-top border-secondary-subtle">
                            Already have an account? <a href="index.html" class="fw-semibold">Sign in here</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/client.js"></script>
    <script src="js/registration.js"></script>
</body>
</html>
