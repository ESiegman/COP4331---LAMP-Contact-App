<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contacts — Contacts Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <!-- Header -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">My Contacts</h1>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <a id="adminLink" href="admin.html" class="btn btn-outline-light btn-sm rounded-pill px-3 d-none">
                            <i class="bi bi-shield-lock me-1"></i> Admin Panel
                        </a>
                        <div class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                            <span id="userName" class="small fw-medium text-body"></span>
                            <button type="button" id="passwordButton" class="btn btn-outline-light btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#passwordModal" title="Change password">
                                <i class="bi bi-key"></i>
                            </button>
                            <button type="button" id="logoutButton" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                <i class="bi bi-box-arrow-right me-1"></i> Log Out
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">

                        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-between gap-3 mb-4">
                            <div class="input-group" style="max-width: 420px;">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email, or phone" autocomplete="off" />
                            </div>
                            <button type="button" id="addContactButton" class="btn btn-success fw-semibold" data-bs-toggle="modal" data-bs-target="#contactModal">
                                <i class="bi bi-plus-lg me-1"></i> Add Contact
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-dark-custom align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="contactsTableBody"></tbody>
                            </table>
                        </div>

                        <div id="emptyState" class="text-center text-secondary-contrast py-5 d-none">
                            <i class="bi bi-person-x display-6 d-block mb-2"></i>
                            No contacts found. Try a different search, or add a new one.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Add / Edit Contact Modal -->
    <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <form id="contactForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold" id="contactModalTitle">Add Contact</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="contactId" />
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label form-label-contrast small">First Name</label>
                                <input type="text" id="contactFirstName" class="form-control" required />
                            </div>
                            <div class="col-6">
                                <label class="form-label form-label-contrast small">Last Name</label>
                                <input type="text" id="contactLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label form-label-contrast small">Email</label>
                            <input type="email" id="contactEmail" class="form-control" required />
                        </div>
                        <div class="mb-2">
                            <label class="form-label form-label-contrast small">Phone Number</label>
                            <input type="tel" id="contactPhone" class="form-control" required />
                        </div>
                        <div id="contactFormResult" class="small fw-semibold"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="contactSaveButton" class="btn btn-primary fw-semibold">Save Contact</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Delete Contact</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Delete <strong id="deleteContactName"></strong>? This can't be undone.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmDeleteButton" class="btn btn-outline-danger fw-semibold">
                        <i class="bi bi-trash3 me-1"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <form id="passwordForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Change Password</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label form-label-contrast small">Current Password</label>
                            <input type="password" id="currentPassword" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label form-label-contrast small">New Password</label>
                            <input type="password" id="newPassword" class="form-control" minlength="8" required />
                        </div>
                        <div class="mb-2">
                            <label class="form-label form-label-contrast small">Confirm New Password</label>
                            <input type="password" id="newPasswordConfirm" class="form-control" minlength="8" required />
                        </div>
                        <div id="passwordFormResult" class="small fw-semibold"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary fw-semibold">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/client.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
