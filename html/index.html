<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Manager Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #090d16 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .container-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Card Styling */
        .login-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            border: 1.5px solid #6366f1;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Header Section */
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Form Group Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #e2e8f0;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #090d16;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            background: #0f172a;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 28px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
        }

        .btn-login:hover:not(:disabled) {
            background: linear-gradient(90deg, #818cf8 0%, #a5b4fc 100%);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Footer / Register Link */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            font-size: 13px;
        }

        .login-footer a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .login-footer a:hover {
            color: #c7d2fe;
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert-box {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert-box.show {
            display: block;
        }

        .alert-success {
            background: #065f46;
            border: 1px solid #10b981;
            color: #a7f3d0;
        }

        .alert-error {
            background: #7f1d1d;
            border: 1px solid #dc2626;
            color: #fca5a5;
        }

        .alert-warning {
            background: #78350f;
            border: 1px solid #f59e0b;
            color: #fcd34d;
        }

        /* Error Messages */
        .error-message {
            color: #fca5a5;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .form-group.error input {
            border-color: #dc2626;
            background: rgba(220, 38, 38, 0.05);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container-wrapper">
    <div class="login-card">
        <!-- Header -->
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your Contacts Manager account</p>
        </div>

        <!-- Alert Messages -->
        <div class="alert-box alert-success" id="successMessage">
            ✓ Login successful! Redirecting...
        </div>

        <div class="alert-box alert-error" id="errorMessage"></div>

        <div class="alert-box alert-warning" id="warningMessage"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <!-- Username -->
            <div class="form-group">
                <label for="loginName">Username</label>
                <input 
                    type="text" 
                    id="loginName" 
                    name="username" 
                    placeholder="Enter your username"
                    required
                >
                <div class="error-message" id="usernameError"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input 
                    type="password" 
                    id="loginPassword" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                >
                <div class="error-message" id="passwordError"></div>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            Don't have an account? <a id="registerLink">Create one here</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="text/javascript" src="js/md5.js"></script>
<script type="text/javascript" src="js/code.js"></script>
<script>
    // Login Form Handler
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        const registerLink = document.getElementById('registerLink');

        // Redirect to registration
        if (registerLink) {
            registerLink.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'registration.html';
            });
        }

        // Form Submission
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Clear previous alerts
                clearAlerts();
                clearErrors();

                // Validate form
                if (validateForm()) {
                    doLogin();
                }
            });
        }
    });

    // Clear Alert Messages
    function clearAlerts() {
        document.getElementById('successMessage').classList.remove('show');
        document.getElementById('errorMessage').classList.remove('show');
        document.getElementById('warningMessage').classList.remove('show');
    }

    // Clear Error Messages
    function clearErrors() {
        document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
        document.querySelectorAll('.form-group').forEach(el => el.classList.remove('error'));
    }

    // Validation Function
    function validateForm() {
        const username = document.getElementById('loginName').value.trim();
        const password = document.getElementById('loginPassword').value;

        let isValid = true;

        // Username Validation
        if (!username || username.length < 3) {
            showError('usernameError', 'Please enter a valid username');
            isValid = false;
        }

        // Password Validation
        if (!password || password.length < 8) {
            showError('passwordError', 'Please enter a valid password');
            isValid = false;
        }

        return isValid;
    }

    // Show Error Message
    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        if (errorElement) {
            errorElement.textContent = message;
            errorElement.classList.add('show');
            errorElement.closest('.form-group').classList.add('error');
        }
    }

    // Show Alert Message
    function showAlert(type, message) {
        const alertElement = document.getElementById(type + 'Message');
        if (alertElement) {
            alertElement.textContent = message;
            alertElement.classList.add('show');
        }
    }

    // Login Function (calls your existing doLogin from code.js)
    function doLogin() {
        const username = document.getElementById('loginName').value.trim();
        const password = document.getElementById('loginPassword').value;
        const loginBtn = document.getElementById('loginBtn');

        // Show loading state
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span>Signing In...';

        // Your existing doLogin logic from code.js
        // This will call your backend API
        // After successful login, show success alert and redirect
        
        // Placeholder - your actual doLogin function should handle this
        setTimeout(() => {
            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Sign In';
            showAlert('error', '✗ Login failed. Please check your credentials and try again.');
        }, 1500);
    }
</script>

</body>
</html>
