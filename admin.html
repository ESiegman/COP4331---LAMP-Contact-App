<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Contacts Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-11">

                <!-- Header -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Admin Panel</h1>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <a href="contacts.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i class="bi bi-person-lines-fill me-1"></i> My Contacts
                        </a>
                        <div class="d-flex align-items-center gap-3 bg-body-tertiary px-3 py-2 rounded-pill border">
                            <span id="userName" class="small fw-medium text-body"></span>
                            <button type="button" id="logoutButton" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                <i class="bi bi-box-arrow-right me-1"></i> Log Out
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Users Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">

                        <div class="d-flex flex-column flex-md-row align-items-stretch align-items-md-center justify-content-between gap-3 mb-4">
                            <h2 class="h5 fw-bold mb-0 d-flex align-items-center gap-2 text-white">
                                <i class="bi bi-people text-primary"></i> Users
                            </h2>
                            <div class="d-flex flex-column flex-sm-row gap-2">
                                <div class="input-group" style="max-width: 320px;">
                                    <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                    <input type="text" id="userSearchInput" class="form-control" placeholder="Search users" autocomplete="off" />
                                </div>
                                <button type="button" class="btn btn-success fw-semibold text-nowrap" data-bs-toggle="modal" data-bs-target="#createUserModal">
                                    <i class="bi bi-person-plus me-1"></i> New Account
                                </button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-dark-custom align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Username</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody"></tbody>
                            </table>
                        </div>

                        <div id="usersEmptyState" class="text-center text-secondary-contrast py-5 d-none">
                            <i class="bi bi-people display-6 d-block mb-2"></i>
                            No users found.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Create User Modal -->
    <div class="modal fade" id="createUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <form id="createUserForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">New Account</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label form-label-contrast small">First Name</label>
                                <input type="text" id="newUserFirstName" class="form-control" required />
                            </div>
                            <div class="col-6">
                                <label class="form-label form-label-contrast small">Last Name</label>
                                <input type="text" id="newUserLastName" class="form-control" required />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label form-label-contrast small">Username</label>
                            <input type="text" id="newUserLogin" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label form-label-contrast small">Temporary Password</label>
                            <input type="password" id="newUserPassword" class="form-control" minlength="8" required />
                        </div>
                        <div class="mb-2">
                            <label class="form-label form-label-contrast small">Role</label>
                            <select id="newUserRole" class="form-control">
                                <option value="User" selected>User</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div id="createUserResult" class="small fw-semibold"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary fw-semibold">Create Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Disable User Confirmation -->
    <div class="modal fade" id="disableModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Disable Account</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Disable <strong id="disableUserName"></strong>? They won't be able to sign in, but their data is kept.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmDisableButton" class="btn btn-outline-danger fw-semibold">
                        <i class="bi bi-slash-circle me-1"></i> Disable
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <form id="resetPasswordForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Reset Password</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-secondary-contrast small">Setting a new password for <strong id="resetPasswordUserName"></strong>.</p>
                        <div class="mb-2">
                            <label class="form-label form-label-contrast small">New Password</label>
                            <input type="password" id="resetPasswordValue" class="form-control" minlength="8" required />
                        </div>
                        <div id="resetPasswordResult" class="small fw-semibold"></div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary fw-semibold">Set Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View User Contacts Modal -->
    <div class="modal fade" id="userContactsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content glass-card">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Contacts for <span id="userContactsName"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                        <input type="text" id="userContactsSearch" class="form-control" placeholder="Search this user's contacts" autocomplete="off" />
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                </tr>
                            </thead>
                            <tbody id="userContactsTableBody"></tbody>
                        </table>
                    </div>
                    <div id="userContactsEmptyState" class="text-center text-secondary-contrast py-4 d-none">
                        <i class="bi bi-person-x display-6 d-block mb-2"></i> No contacts found.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/client.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
