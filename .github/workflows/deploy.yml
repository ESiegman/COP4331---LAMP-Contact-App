name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, mysqli
          coverage: none

      - name: Install production dependencies (no dev packages)
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Stage app bundle (composer files, api/src, vendor)
        run: |
          mkdir -p app-bundle
          cp composer.json composer.lock app-bundle/
          cp -r api app-bundle/api
          rm -rf app-bundle/api/public
          cp -r vendor app-bundle/vendor

      - name: Stage frontend bundle (public static files only)
        run: |
          mkdir -p frontend-bundle
          cp index.html registration.html contacts.html admin.html frontend-bundle/
          cp favicon.ico frontend-bundle/
          cp -r css frontend-bundle/css
          cp -r js frontend-bundle/js
          cp -r images frontend-bundle/images

      - name: Deploy frontend to the web root (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./frontend-bundle/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy api/public under /api on the web root (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./api/public/
          remote_path: ${{ secrets.DEPLOY_PATH }}/api
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy app bundle (api/src + vendor) outside the web root (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./app-bundle/
          remote_path: /var/www/contacts-app/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reload Apache (optional)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo systemctl reload apache2
