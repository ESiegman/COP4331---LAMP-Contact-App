name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: this only deploys api/public/ (static entry points) to the
      # droplet's DocumentRoot. Once real endpoints exist under api/public
      # that need App\ classes from api/src/ or Composer packages from
      # vendor/, this workflow needs an additional step to get src/ and a
      # production vendor/ onto the server (outside the web root) and an
      # autoload path the deployed index.php can find in both Docker and
      # production. Not wired up yet since no app code exists yet.
      - name: Deploy over SSH (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./api/public/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Reload Apache (optional)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo systemctl reload apache2
